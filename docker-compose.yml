# Local services for development. Start the database with: docker compose up -d db
# The values below are local-only defaults; override them in .env if you like.
# They must match DATABASE_URL and TEST_DATABASE_URL in backend/app/config.py.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillgraph}
      POSTGRES_DB: ${POSTGRES_DB:-skillgraph}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: your data survives `docker compose down` (use `down -v` to wipe it).
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is first created: makes the separate test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
